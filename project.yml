name: PipSqueak
options:
  bundleIdPrefix: ca.zakr
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: "complete"

targets:
  PipSqueak:
    type: application
    platform: macOS
    sources:
      - path: PipSqueak
        excludes:
          - Resources
      - path: PipSqueak/Resources
        type: resource
    info:
      path: PipSqueak/Info.plist
    entitlements:
      path: PipSqueak/PipSqueak.entitlements
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: PipSqueak/PipSqueak.entitlements
        INFOPLIST_FILE: PipSqueak/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: ca.zakr.PipSqueak
        PRODUCT_NAME: PipSqueak
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        COMBINE_HIDPI_IMAGES: "YES"
